name: Restart rehearsal

# Runs the VPS drill end to end on a disposable runner with sample trading data:
# deploy, app restart, Docker daemon restart as the reboot stand-in, encrypted
# backup and manifest-verified restore, and a fail-closed restart with an
# unresolved pending order. It uses throwaway credentials and keys, stores
# nothing, and never contacts an exchange or the production server.

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: restart-rehearsal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rehearsal:
    name: Restart, backup, and restore rehearsal
    if: github.event_name != 'pull_request' || github.event.label.name == 'restart-rehearsal'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_DIR: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install age, rclone, and PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age rclone postgresql-client >/dev/null

      - name: Generate throwaway paper-mode environment
        run: |
          set -euo pipefail
          umask 077
          echo "DRILL_STATE_DIR=$RUNNER_TEMP/drill" >> "$GITHUB_ENV"
          db_password=$(openssl rand -hex 24)
          cat > .env <<EOF
          POSTGRES_DB=trader
          POSTGRES_USER=trader
          POSTGRES_PASSWORD=$db_password
          DATABASE_URL=postgresql+psycopg://trader:$db_password@db:5432/trader
          TRADING_MODE=paper
          CREDENTIAL_SCOPE=none
          OPERATOR_TOKEN=$(openssl rand -hex 32)
          OPERATOR_ADMIN_TOKEN=$(openssl rand -hex 32)
          EOF
          sed -i 's/^ *//' .env

      - name: Deploy
        run: sh deploy/drill.sh deploy "$(git rev-parse HEAD)"

      - name: Load sample trading state
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f deploy/docker-compose.vps.yml --env-file .env \
            exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -q' <<'SQL'
          INSERT INTO signals (signal_id, symbol, strategy_version, side, quantity, created_at)
            VALUES ('11111111-1111-4111-8111-111111111111', 'BTC-USD', 'rehearsal-fixture', 'buy', 0.01, now());
          INSERT INTO orders (order_id, signal_id, client_order_id, strategy_version, risk_approval_id,
                              status, created_at, symbol, side, order_type, quantity, correlation_id)
            VALUES ('22222222-2222-4222-8222-222222222222', '11111111-1111-4111-8111-111111111111',
                    '22222222-2222-4222-8222-222222222222', 'rehearsal-fixture',
                    '33333333-3333-4333-8333-333333333333', 'filled', now(), 'BTC-USD', 'buy', 'market',
                    0.01, '44444444-4444-4444-8444-444444444444');
          INSERT INTO fills (fill_id, order_id, broker_fill_id, quantity, price, fee, occurred_at)
            VALUES ('55555555-5555-4555-8555-555555555555', '22222222-2222-4222-8222-222222222222',
                    'rehearsal-fill-1', 0.01, 60000, 0.6, now());
          INSERT INTO portfolio_snapshots (batch_id, source, recorded_at)
            VALUES ('66666666-6666-4666-8666-666666666666', 'broker', now());
          INSERT INTO positions_snapshot (snapshot_id, batch_id, symbol, quantity, average_price, as_of, source)
            VALUES (gen_random_uuid(), '66666666-6666-4666-8666-666666666666', 'BTC-USD', 0.01, 60000, now(), 'broker');
          INSERT INTO balances_snapshot (snapshot_id, batch_id, asset, available, hold, as_of, source)
            VALUES (gen_random_uuid(), '66666666-6666-4666-8666-666666666666', 'USD', 99399.4, 0, now(), 'broker');
          INSERT INTO equity_curve (snapshot_id, equity, as_of, source)
            VALUES (gen_random_uuid(), 99999.4, now(), 'broker');
          SQL

      - name: App restart drill
        run: sh deploy/drill.sh before-reboot

      - name: Restart Docker daemon as the reboot stand-in
        run: sudo systemctl restart docker

      - name: Post-restart drill with sample state
        run: |
          set -euo pipefail
          sh deploy/drill.sh after-reboot | tee "$RUNNER_TEMP/after.txt"
          for expected in orders=1 fills=1 signals=1 system_events=0 audit_notes=0 market_candles=0 portfolio_snapshots=1 positions_snapshot=1 balances_snapshot=1 equity_curve=1 discrepancies=0; do
            grep -q "INFO   $expected\$" "$RUNNER_TEMP/after.txt" || { echo "::error::expected $expected after restart"; exit 1; }
          done

      - name: Encrypted backup and manifest-verified restore
        run: |
          set -euo pipefail
          umask 077
          # Throwaway scratch database, started after the Docker restart.
          docker run -d --name trader-scratch -e POSTGRES_USER=restore_user \
            -e POSTGRES_PASSWORD=scratch-only -e POSTGRES_DB=trader_restore \
            -p 127.0.0.1:5433:5432 postgres:16-alpine >/dev/null
          for attempt in $(seq 1 30); do
            pg_isready -q -h 127.0.0.1 -p 5433 -U restore_user -d trader_restore && break
            sleep 2
          done
          age-keygen -o "$RUNNER_TEMP/identity.txt" 2>/dev/null
          export AGE_RECIPIENT=$(age-keygen -y "$RUNNER_TEMP/identity.txt")
          export BACKUP_REMOTE="$RUNNER_TEMP/offbox"
          export BACKUP_DIR="$RUNNER_TEMP/backups"
          sh deploy/backup-postgres.sh | tee "$RUNNER_TEMP/backup.txt"
          dump=$(sed -n 's/^encrypted_backup=//p' "$RUNNER_TEMP/backup.txt")
          manifest=$(sed -n 's/^encrypted_manifest=//p' "$RUNNER_TEMP/backup.txt")
          AGE_IDENTITY_FILE="$RUNNER_TEMP/identity.txt" \
          SCRATCH_DATABASE_URL=postgresql://restore_user:scratch-only@127.0.0.1:5433/trader_restore \
            sh deploy/restore-verify-postgres.sh "$BACKUP_REMOTE/$dump" "$BACKUP_REMOTE/$manifest" \
            | tee "$RUNNER_TEMP/restore.txt"
          grep -qx 'verified orders=1' "$RUNNER_TEMP/restore.txt"
          grep -qx 'restore_verified=1' "$RUNNER_TEMP/restore.txt"

      - name: Unresolved pending order halts trading on restart
        run: |
          set -euo pipefail
          compose() { docker compose -f docker-compose.yml -f deploy/docker-compose.vps.yml --env-file .env "$@"; }
          compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -q' <<'SQL'
          INSERT INTO orders (order_id, signal_id, client_order_id, strategy_version, risk_approval_id,
                              status, created_at, symbol, side, order_type, quantity, correlation_id)
            VALUES ('77777777-7777-4777-8777-777777777777', '11111111-1111-4111-8111-111111111111',
                    '77777777-7777-4777-8777-777777777777', 'rehearsal-fixture',
                    '33333333-3333-4333-8333-333333333333', 'pending_submit', now(), 'BTC-USD', 'buy',
                    'market', 0.01, '88888888-8888-4888-8888-888888888888');
          SQL
          compose restart app >/dev/null
          for attempt in $(seq 1 60); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' "$(compose ps -q app)")" = healthy ] && break
            sleep 5
          done
          sh deploy/drill.sh status | tee "$RUNNER_TEMP/status.txt"
          grep -qx 'kill_switch=halted' "$RUNNER_TEMP/status.txt"
          grep -qx 'recovery=halted' "$RUNNER_TEMP/status.txt"

      - name: Startup recovery log lines
        if: always()
        run: |
          docker compose -f docker-compose.yml -f deploy/docker-compose.vps.yml --env-file .env \
            logs --no-color app 2>/dev/null | grep "startup recovery" || true

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.yml -f deploy/docker-compose.vps.yml --env-file .env down -v || true
          docker rm -f trader-scratch >/dev/null 2>&1 || true
          rm -rf .env "$RUNNER_TEMP"/identity.txt "$RUNNER_TEMP"/offbox "$RUNNER_TEMP"/backups
