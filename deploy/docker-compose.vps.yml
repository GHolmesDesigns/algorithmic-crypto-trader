services:
  db:
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

  app:
    restart: unless-stopped
    environment:
      TRADING_MODE: ${TRADING_MODE:-paper}
      CREDENTIAL_SCOPE: ${CREDENTIAL_SCOPE:-none}
      BROKER_PROVIDER: ${BROKER_PROVIDER:-}
      COINBASE_API_KEY: ${COINBASE_API_KEY:-}
      COINBASE_PRIVATE_KEY: ${COINBASE_PRIVATE_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_SECRET: ${GEMINI_API_SECRET:-}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:?OPERATOR_TOKEN must be set}
      OPERATOR_ADMIN_TOKEN: ${OPERATOR_ADMIN_TOKEN:?OPERATOR_ADMIN_TOKEN must be set}
      OPERATOR_COOKIE_SECURE: "1"
      KILL_SWITCH_FILE: /var/lib/trader/kill-switch.json
      LOSS_STATE_FILE: /var/lib/trader/loss-limits.json
      PAPER_RUNTIME_ENABLED: ${PAPER_RUNTIME_ENABLED:-1}
      PAPER_SYMBOLS: ${PAPER_SYMBOLS:-BTC-USD}
      PAPER_STRATEGY_FAST_BARS: ${PAPER_STRATEGY_FAST_BARS:-3}
      PAPER_STRATEGY_SLOW_BARS: ${PAPER_STRATEGY_SLOW_BARS:-8}
      PAPER_HISTORY_BARS: ${PAPER_HISTORY_BARS:-50}
      PAPER_ORDER_QUANTITY: ${PAPER_ORDER_QUANTITY:-0.0001}
      PAPER_MIN_NOTIONAL: ${PAPER_MIN_NOTIONAL:-1}
      PAPER_ESTIMATED_SLIPPAGE: ${PAPER_ESTIMATED_SLIPPAGE:-0.005}
      PAPER_COOLDOWN_SECONDS: ${PAPER_COOLDOWN_SECONDS:-300}
      TRADING_KILL_SWITCH_FILE: ${TRADING_KILL_SWITCH_FILE:-}
      ALERT_NTFY_TOPIC_URL: ${ALERT_NTFY_TOPIC_URL:-}
      ALERT_NTFY_TOKEN: ${ALERT_NTFY_TOKEN:-}
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-}
      ALERT_SMTP_PORT: ${ALERT_SMTP_PORT:-587}
      ALERT_SMTP_USERNAME: ${ALERT_SMTP_USERNAME:-}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
      ALERT_SMTP_STARTTLS: ${ALERT_SMTP_STARTTLS:-1}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_TIMEOUT_SECONDS: ${ALERT_TIMEOUT_SECONDS:-10}
    ports:
      - "127.0.0.1:8000:8000"
