{%- extends "_operator_page.html" -%}
{% block title %}Sign in{% endblock %}
{% block page_name %}Operator sign-in{% endblock %}
{% block content %}
        <section class="block" aria-labelledby="login-heading">
          <h1 id="login-heading">Operator sign-in</h1>
          <form class="panel" method="post" action="/operator/login">
            <div class="field">
              <label for="operator-token">Operator token</label>
              <input id="operator-token" type="password" name="token" autocomplete="current-password" required>
            </div>
            <div class="actions">
              <button class="button button-rearm" type="submit">Sign in</button>
            </div>
          </form>
          <p class="note">The token goes in the form, never in the address. The session lasts up to eight hours; sign out on a shared device.</p>
        </section>
{% endblock %}
